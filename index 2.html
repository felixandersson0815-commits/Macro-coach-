:root{--bg:#f6f1ff;--b2:#e6f8f1;--card:#fff;--tx:#1d1533;--mut:#6a6285;--ac:#7c3aed;--ac2:#ff5d8f;--on:#fff;--bd:#e5dcf7;--P:#2563eb;--C:#f59e0b;--F:#ec4899;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--b2:#0e1f2a;--card:#211a38;--tx:#f0eafd;--mut:#a79fc4;--ac:#a78bfa;--ac2:#ff7aa8;--on:#150f26;--bd:#352b57;--P:#60a5fa;--C:#fbbf24;--F:#f472b6}}
:root[data-theme="dark"]{--bg:#150f26;--b2:#0e1f2a;--card:#211a38;--tx:#f0eafd;--mut:#a79fc4;--ac:#a78bfa;--ac2:#ff7aa8;--on:#150f26;--bd:#352b57;--P:#60a5fa;--C:#fbbf24;--F:#f472b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg),var(--b2));background-attachment:fixed;color:var(--tx);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:27px;margin:6px 0 10px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;margin:16px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(124,58,237,.08)}
.mut{color:var(--mut);font-size:14px}.nm{font-weight:700;font-size:17px;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
input,select{width:150px;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.b{width:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:14px;padding:14px;font:700 16px inherit;margin:4px 0 12px}
.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;margin:8px 8px 0 0;text-decoration:none;display:inline-block}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.m{display:flex;gap:14px;font-size:14px;font-weight:700;flex-wrap:wrap}
.m i{font-style:normal;color:var(--mut);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:700 10px/1.2 inherit}
.ck{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ck input{width:22px;height:22px;flex:none}
.wl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.wl button{background:none;border:0;color:var(--mut);font-size:16px}
nav button.on{color:var(--ac)}
.wk{font-size:14px;margin:5px 0}.wk b{display:inline-block;width:78px;color:var(--mut);font-weight:500}
.pic{height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:8px;background:var(--g)}
.big{height:150px;font-size:76px}
.s0{--g:linear-gradient(135deg,#ffd166,#ff8e53)}.s1{--g:linear-gradient(135deg,#7ee8a2,#2bb3a3)}.s2{--g:linear-gradient(135deg,#a78bfa,#f472b6)}.s3{--g:linear-gradient(135deg,#7dd3fc,#818cf8)}
.lnk{cursor:pointer}.r2{display:flex;gap:12px;align-items:center;cursor:pointer}.em{font-size:30px}
ul,ol{margin:0;padding-left:20px}li{margin:5px 0}
textarea{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-height:64px;margin-bottom:8px}
input[type=checkbox]{width:26px;height:26px;flex:none}.sets{display:flex;gap:8px;margin:6px 0}
.st{display:flex;align-items:center;gap:8px;margin:6px 0}.st input[type=number]{width:72px}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:6px}.up{background:rgba(34,197,94,.18);color:#16a34a}.pr{background:rgba(245,158,11,.2);color:#d97706}
nav button{font-size:11px;padding:8px 0 6px}nav button b{display:block;font-size:21px;line-height:1.15;font-weight:400}nav button.on{box-shadow:inset 0 3px 0 var(--ac)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}.hero .mut{color:rgba(255,255,255,.9)}
.xp{height:10px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden;margin:10px 0 4px}.xp span{display:block;height:100%;background:#fff;border-radius:5px}
.dots{display:flex;gap:8px;margin:8px 0 0}.dots i{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}.dots i.f{background:var(--ac);border-color:var(--ac);color:#fff}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.bg div{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:12px}.bg div b{display:block;font-size:32px;font-weight:400}.bg .lk{opacity:.4;filter:grayscale(1)}
.toast{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.55);z-index:9}.toast>div{background:var(--card);border-radius:22px;padding:26px;text-align:center;max-width:300px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:10;animation:fall 2.4s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
